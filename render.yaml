services:
  - type: web
    name: peoplepay360-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: peoplepay360-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://peoplepay360.netlify.app,http://localhost:5173"
      - key: PDF_STORAGE_PATH
        value: "./storage/payslips"
    healthCheckPath: /api/health

databases:
  - name: peoplepay360-db
    databaseName: peoplepay360
    user: peoplepay360_user
    plan: free
